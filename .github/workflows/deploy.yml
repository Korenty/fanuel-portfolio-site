
name: Build and Deploy React App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        # This now uses the new package.json file
        run: npm install

      - name: Create index.html with Embedded React Code
        # This uses simple 'echo' commands and 'cat' to sequentially build the file.
        run: |
          mkdir -p build
          
          # 1. Start HTML structure
          echo "<!DOCTYPE html>" > build/index.html
          echo "<html lang='en'>" >> build/index.html
          echo "<head>" >> build/index.html
          echo "    <meta charset='UTF-8'>" >> build/index.html
          echo "    <meta name='viewport' content='width=device-width, initial-scale=1.0'>" >> build/index.html
          echo "    <title>Fanuel Debebe Portfolio</title>" >> build/index.html
          echo "    <script src='https://cdn.tailwindcss.com'></script>" >> build/index.html
          echo "    <script crossorigin src='https://unpkg.com/react@18/umd/react.development.js'></script>" >> build/index.html
          echo "    <script crossorigin src='https://unpkg.com/react-dom@18/umd/react-dom.development.js'></script>" >> build/index.html
          echo "    <script src='https://unpkg.com/@babel/standalone/babel.min.js'></script>" >> build/index.html
          echo "</head>" >> build/index.html
          echo "<body>" >> build/index.html
          echo "    <div id='root'></div>" >> build/index.html
          echo "    <!-- EMBEDDED REACT CODE -->" >> build/index.html
          echo "    <script type='text/babel'>" >> build/index.html
          
          # 2. Append the contents of index.jsx (the component code)
          cat index.jsx >> build/index.html
          
          # 3. Append the final rendering script and close tags
          echo "        // FINAL RENDER CALL" >> build/index.html
          echo "        const container = document.getElementById('root');" >> build/index.html
          echo "        const root = ReactDOM.createRoot(container);" >> build/index.html
          echo "        root.render(React.createElement(App));" >> build/index.html
          echo "    </script>" >> build/index.html
          echo "</body>" >> build/index.html
          echo "</html>" >> build/index.html
          
          # Copy other necessary files, including the anti-Jekyll file
          cp profile.jpg build/profile.jpg
          cp .nojekyll build/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          publish_branch: gh-pages
