name: Build and Deploy React App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install react react-dom

      - name: Create index.html and Copy Files
        # *** FIX APPLIED: Added the inline rendering script after loading index.jsx ***
        run: |
          mkdir -p build
          echo "<!DOCTYPE html><html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Fanuel Debebe Portfolio</title><!-- Load Tailwind --><script src='https://cdn.tailwindcss.com'></script><!-- Load React & ReactDOM Globally --><script crossorigin src='https://unpkg.com/react@18/umd/react.development.js'></script><script crossorigin src='https://unpkg.com/react-dom@18/umd/react-dom.development.js'></script><!-- Load Babel Standalone to process JSX --><script src='https://unpkg.com/@babel/standalone/babel.min.js'></script></head><body><div id='root'></div><!-- Load the JSX file and tell Babel to process it --><script type='text/babel' src='./index.jsx'></script><!-- FINALLY, RENDER THE APP COMPONENT --><script type='text/babel'>const container = document.getElementById('root');const root = ReactDOM.createRoot(container);root.render(React.createElement(App));</script></body></html>" > build/index.html
          cp index.jsx build/index.jsx
          cp profile.jpg build/profile.jpg

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          publish_branch: gh-pages
